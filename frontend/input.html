<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body{
            background: #071b37;
            color:white;
            font-family: 'Inter', sans-serif;
        }
        #logo_picture{
            display:inline-block;
            width:110px;
            height:100px;
        }
        #naslov{
            display:inline-block;

        }
        header{
            display: flex;
            align-items:center ;

        }

        .upload-box {
            background: #09192F;
            border: 2px dashed #2875E8;
            padding: 25px;
            text-align: center;
            width: 500px;
            margin: auto;
            margin-top: 2%;
            border-radius:20px;
        }

        .file-name{
            background: #09192F;
            border: 2px solid #2875E8;
            padding: 20px;
            width: 500px;
            margin: auto;
            margin-top: 2%;
            border-radius:15px;
            display:none;
        }

        .upload-content {
            display: flex;
            flex-direction: column;
            align-items: center;   /* вертикално порамнување */
            justify-content: center; /* хоризонтално центрирање */
            gap: 10px;             /* растојание меѓу иконата и текстот */
        }

        .icon {
            width: 50px;
            height: 50px;
            display: block;
        }
        .file-label{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:11px 22px;
            background: #2B72FB;
            color:white;
            border-radius:10px;
            font-size:14px;
            font-weight:500;
            cursor:pointer;
            transition: filter .15s ease, transform .15s ease;
            position:relative;
            z-index:1;
        }

        .file-label:hover{ filter:brightness(1.1); }
        .file-label:active{ transform: scale(0.98); }

        #mriInput{
            position:absolute;
            width:1px; height:1px;
            opacity:0; overflow:hidden;
        }
        .format {
            font-size: 12px;
            color: #666;
        }
        .separator {
            margin: 10px 0;
            font-weight: bold;
        }
        #start{
            width:400px;
            height: 50px;
            margin-left: 36%;
            margin-top: 2%;
            border-radius:10px ;
            background: #2B72FB;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #separate{
            width:100%;
            max-width:740px;
            height:2px;
            background: linear-gradient(90deg, transparent, #1d426c 20%, #1c3555 80%, transparent);
            margin: 32px 0 0;
        }
        #title{
            font-family:'Space Grotesk', sans-serif;

        }
        #myRange{
            width: 300px;
            height:25px;
            margin-left:2%;
        }
        .slide_container{
            margin-left:32%;
            margin-top: 20px;
            display: flex;
            align-items: center;
            font-family:'Space Grotesk', sans-serif;
        }#show_slice_num {
             display: inline-flex;
             align-items: center;
             justify-content: center;
             width: 50px;
             height: 40px;
             background: linear-gradient(135deg, #6C63FF 0%, #3B82F6 100%);
             border: none;
             border-radius: 12px;
             color: white;
             font-size: 16px;
             font-weight: 700;
             font-family: 'Segoe UI', system-ui, sans-serif;
             box-sizing: border-box;
             margin-left: 1%;
             box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
             transition: transform 0.2s ease, box-shadow 0.2s ease;
         }

        #show_slice_num:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.45);
        }
    </style>
</head>
<body>
<header>
    <img id="logo_picture" src="../brain%20logo.png">
    <div id="naslov">
        <h1 id="title"style="margin: 0px;">Brain MRI Segmentation</h1>
        <p id="explanation"style="margin: 0px;color:#a3b9d1">Detects and visualize brain tumors using deep learning</p>
    </div>

</header>
<p id="separate"></p>


<div class="upload-box" id="uploadBox">

    <div class="upload-content">
        <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 18a4 4 0 01-1-7.87A5 5 0 0116.9 8.1 4.5 4.5 0 0117 17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 12v7m0-7l-2.5 2.5M12 12l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p>Drag & drop your FLAIR MRI image here</p>
    </div>

    <p class="separator">or</p>

    <label class="file-label" for="mriInput">Choose MRI File</label>
    <input type="file" id="mriInput" accept=".nii,.nii.gz">


    <p class="format">Supported format: .nii.gz</p>


</div>
<div class="slide_container">
    <label>Slice number:</label>
    <input type="range" min="1" max="155" value="100" class="slider" id="myRange">
    <p id="show_slice_num">100</p>
</div>
<p class="file-name" id="fileName"></p>

<button id="start">
    <svg width="40" height="40" viewBox="0 0 60 60" display="inline-block" xmlns="http://www.w3.org/2000/svg">
        <polygon points="20,15 20,45 45,30" fill="white"/>
    </svg>

    Start Segmentation
</button>
<script src="main.js"></script>

</body>

</html>
